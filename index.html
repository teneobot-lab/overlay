<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Overlay - CamelUngu100</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
.overlay{position:relative;width:min(100vw,calc(100vh*9/16));aspect-ratio:9/16;margin:0 auto;overflow:hidden;background:#000;container-type:inline-size;display:flex;flex-direction:column}

/* ===== ATAS ===== */
.top{position:relative;height:23%;overflow:hidden;background:#050a24}
.top canvas{position:absolute;inset:0;width:100%;height:100%}
.sep{height:.45%;background:#fff;flex:none;box-shadow:0 0 6px rgba(160,220,255,.6)}
/* ===== TENGAH ===== */
.mid{height:42.5%;background:#00ff00}

/* ===== BAWAH ===== */
.bot{position:relative;flex:1;overflow:hidden;
  background:radial-gradient(ellipse at 30% 30%,#10306a 0%,transparent 60%),linear-gradient(180deg,#0a1b45 0%,#040a1f 100%)}
.stars{position:absolute;inset:0;opacity:.85;animation:tw 4s ease-in-out infinite alternate;
  background-image:radial-gradient(1.4px 1.4px at 8% 18%,#fff,transparent),radial-gradient(1px 1px at 22% 40%,#bdf,transparent),radial-gradient(1.2px 1.2px at 35% 12%,#fff,transparent),radial-gradient(1px 1px at 48% 55%,#9cf,transparent),radial-gradient(1.4px 1.4px at 60% 22%,#fff,transparent),radial-gradient(1px 1px at 74% 62%,#bdf,transparent),radial-gradient(1.2px 1.2px at 88% 15%,#fff,transparent),radial-gradient(1px 1px at 15% 78%,#fff,transparent),radial-gradient(1px 1px at 52% 85%,#9cf,transparent),radial-gradient(1.3px 1.3px at 93% 48%,#fff,transparent)}
@keyframes tw{from{opacity:.5}to{opacity:1}}
.ghost{position:absolute;left:-18%;top:-6%;width:92%;opacity:.28;filter:blur(2.5px) grayscale(.5) brightness(.9);mix-blend-mode:screen}
.glowbase{position:absolute;right:-5%;bottom:0;width:80%;height:70%;pointer-events:none;
  background:radial-gradient(ellipse at 60% 80%,rgba(30,140,255,.5),transparent 65%);animation:gb 2.4s ease-in-out infinite alternate}
@keyframes gb{from{opacity:.6}to{opacity:1}}
.clouds{position:absolute;left:-10%;right:-10%;bottom:-6%;height:20%;z-index:4;pointer-events:none;filter:blur(7px);animation:cl 8s ease-in-out infinite alternate;
  background:radial-gradient(ellipse 14% 45% at 12% 80%,#9fd8ff,transparent 70%),radial-gradient(ellipse 18% 55% at 32% 95%,#7fc4ff,transparent 70%),radial-gradient(ellipse 16% 40% at 52% 85%,#b9e4ff,transparent 70%),radial-gradient(ellipse 18% 55% at 76% 90%,#5fb0ff,transparent 70%),radial-gradient(ellipse 14% 45% at 95% 80%,#9fd8ff,transparent 70%)}
@keyframes cl{from{transform:translateX(-3%)}to{transform:translateX(3%)}}
.bot>canvas{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}

/* ===== AVATAR ===== */
.avatar{position:absolute;right:2%;top:30%;width:62%;z-index:3}
.float{animation:flt 4s ease-in-out infinite;will-change:transform}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6%)}}
.hit{position:relative;will-change:transform,opacity;opacity:0}
.avmain{position:relative;z-index:2;width:100%;display:block;filter:drop-shadow(0 0 1.5px rgba(160,240,255,.95)) drop-shadow(0 0 14px rgba(30,150,255,.85))}
.sheen{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;mix-blend-mode:screen;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.sheen i{position:absolute;top:-10%;bottom:-10%;width:30%;left:-45%;background:linear-gradient(100deg,transparent,rgba(170,235,255,.5),transparent);transform:skewX(-18deg);animation:shn 5s ease-in-out infinite}
@keyframes shn{0%,45%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(480%) skewX(-18deg)}}
#fire{position:absolute;left:-30%;top:-34%;width:160%;height:134%;z-index:1;pointer-events:none}
.embers{position:absolute;inset:-6% -8% 0;z-index:3;pointer-events:none}
.embers i{position:absolute;border-radius:50%;background:#aef3ff;box-shadow:0 0 8px #28b8ff,0 0 14px #0a6cff;opacity:0;animation:em linear infinite}
@keyframes em{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-34vh) translateX(var(--dx)) scale(.1);opacity:0}}

/* ===== TEKS ===== */
.txt{position:absolute;left:3.5%;top:5%;width:70%;z-index:10;pointer-events:none}
.main{position:relative;font-family:'Russo One',sans-serif;font-size:6cqw;line-height:1.1;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;opacity:1;transform:skewX(-12deg);will-change:transform,opacity}
.main .l{display:block;position:relative;transform-origin:0 50%;will-change:transform,opacity}
.main .b,.main .f{transform-origin:0 50%}
.main .b{position:absolute;left:0;top:0;color:#0a2f9c;-webkit-text-stroke:4px #0a2f9c;text-shadow:0 0 6px #1a8cff,0 0 16px #0a64ff,0 3px 3px rgba(0,0,40,.85)}
.main .f{position:relative;display:block;
  background-image:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%),linear-gradient(180deg,#fff 0%,#e4f6ff 40%,#3f9dff 100%);
  background-size:260% 100%,100% 100%;background-position:100% 0,0 0;background-repeat:no-repeat;
  -webkit-background-clip:text;background-clip:text;color:transparent}
.badge{display:inline-flex;align-items:center;gap:2cqw;margin-top:2.4cqw;padding:.9cqw 3cqw .9cqw 1.3cqw;border-radius:99px;background:rgba(0,8,28,.85);
  border:2px solid #fff;box-shadow:0 0 10px rgba(0,220,255,.7),-2px 0 0 #ff2d6a,2px 0 0 #1ff0ff;opacity:0;transform:translateX(-6cqw);transition:transform .8s cubic-bezier(.16,1,.3,1),opacity .6s}
.badge.in{opacity:1;transform:none}
.badge svg{width:4cqw;height:4cqw}
.badge span{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:3.8cqw;color:#fff;letter-spacing:.04em}
.gift{position:absolute;left:0;top:100%;margin-top:2.4cqw;width:7cqw;opacity:0;transition:opacity .5s}
.gift.in{opacity:1}
.gift rect,.gift path{fill:none;stroke:#e8f6ff;stroke-width:2.2;stroke-linecap:round;filter:drop-shadow(0 0 4px #4bf);stroke-dasharray:140;stroke-dashoffset:140}
.gift.in rect,.gift.in path{animation:dr 1.2s ease forwards .2s}
@keyframes dr{to{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="overlay">
  <div class="top"><canvas id="city"></canvas><canvas id="boltTop"></canvas></div>
  <div class="sep"></div>
  <div class="mid"></div>
  <div class="sep"></div>
  <div class="bot">
    <div class="stars"></div>
    <img class="ghost" data-av alt="" />
    <div class="glowbase"></div>
    <div class="avatar" id="avatar">
      <div class="float"><div class="hit" id="hit">
        <canvas id="fire"></canvas>
        <img class="avmain" data-av alt="CamelUngu100" />
        <div class="sheen" id="sheen"><i></i></div>
        <div class="embers" id="embers"></div>
      </div></div>
    </div>
    <div class="clouds"></div>
    <canvas id="boltBot"></canvas>
    <div class="txt">
      <div class="main" id="main"></div>
      <div class="badge" id="badge">
        <svg viewBox="0 0 30 30"><path d="M16 4v14.2a4.2 4.2 0 1 1-3.4-4.1" fill="none" stroke="#1ff0ff" stroke-width="3" transform="translate(1.2,1)"/><path d="M16 4c.4 3 2.2 5 5.5 5.3" fill="none" stroke="#ff2d6a" stroke-width="3" transform="translate(-.8,0)"/><path d="M16 4v14.2a4.2 4.2 0 1 1-3.4-4.1M16 4c.4 3 2.2 5 5.5 5.3" fill="none" stroke="#fff" stroke-width="3"/></svg>
        <span>akubisajelasinkok</span>
      </div>

    </div>
  </div>
</div>

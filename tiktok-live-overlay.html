<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Live Frame 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--w:min(100vw,56.25vh);--band:calc(var(--w)*.6076);--win:calc(var(--w)*.5625)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#1b1b1f}
body.clean{background:transparent}
body.green{background:#17d822}
#stage{width:var(--w);height:calc(var(--w)*1.7778);margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;font-family:'Russo One','Arial Black',Impact,sans-serif}
/* Jendela game 16:9 */
#win{height:var(--win);flex:none;position:relative}
#win{background:#17d820}
body.alpha #win{background:transparent}
/* Band atas & bawah */
.band{height:var(--band);flex:none;position:relative;overflow:hidden;background:
  radial-gradient(ellipse 60% 50% at 75% 30%,#3b3b40 0,transparent 70%),
  radial-gradient(ellipse 50% 60% at 20% 80%,#2a2a2e 0,transparent 70%),
  linear-gradient(160deg,#08080a,#16161a 50%,#050506)}
#win{background:#17d820}
.moon{position:absolute;right:auto;bottom:auto;width:calc(var(--w)*.21);height:calc(var(--w)*.21);left:calc(var(--w)*.245);top:calc(var(--w)*.126);opacity:.95}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hazard{position:absolute;left:0;right:0;bottom:0;height:calc(var(--w)*.035);opacity:.55;
  background:repeating-linear-gradient(115deg,#222 0 calc(var(--w)*.05),#555 calc(var(--w)*.05) calc(var(--w)*.065))}
.top .hazard{display:none}
.band.top::after,.band.bot::before{content:"";position:absolute;left:0;right:0;height:3px;background:#ffffff22}
.band.top::after{bottom:0}.band.bot::before{top:0}
/* Teks */
.t{color:#fff;text-transform:uppercase;line-height:.95;text-align:center;letter-spacing:.01em;
  -webkit-text-stroke:calc(var(--w)*.014) #0a0a0c;paint-order:stroke fill;
  text-shadow:0 calc(var(--w)*.012) 0 #000,0 0 calc(var(--w)*.04) #ffffff40;transform:skewX(-8deg)}
.top .t{position:absolute;left:0;right:0;bottom:11%}
#logo{font-size:calc(var(--w)*.105);letter-spacing:.015em}
#welcome{font-size:calc(var(--w)*.115)}
.st{display:none}
#stage.s0 .a,#stage.s1 .b{display:block;animation:slam .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes slam{from{transform:skewX(-8deg) scale(.3);opacity:0}}
/* Avatar & caption */
#avatar{position:absolute;right:-4%;bottom:0;width:56%;animation:bob 3.6s ease-in-out infinite;transform-origin:50% 100%}
#avatar img{display:block;width:100%;height:auto;position:relative;filter:drop-shadow(0 0 calc(var(--w)*.012) #ffffffcc) drop-shadow(calc(var(--w)*-.01) 0 calc(var(--w)*.03) #0009)}
.halo{position:absolute;inset:-12% -8% 0;background:radial-gradient(ellipse at 50% 55%,#ffffff40,transparent 65%);animation:pulse 3.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@keyframes bob{50%{transform:translateY(1.2%) scale(1.012)}}
.cap{position:absolute;left:4%;bottom:14%;width:56%;font-size:calc(var(--w)*.064);text-align:left;transform-origin:left}
.cap.t{transform:skewX(-8deg);left:4%;right:auto;text-align:left}
#stage.s0 .cap.a,#stage.s1 .cap.b{animation:wipe .6s ease-out both}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.bar{position:absolute;left:4%;bottom:12%;height:calc(var(--w)*.025);width:56%;background:#fff;transform:skewX(-8deg);transform-origin:left;display:none}
#stage.s0 .bar.a,#stage.s1 .bar.b{display:block;animation:sweep .6s ease-out both}
@keyframes sweep{0%{transform:skewX(-8deg) scaleX(0)}60%{transform:skewX(-8deg) scaleX(1);opacity:1}100%{transform:skewX(-8deg) scaleX(1);opacity:0}}
.band::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,#000c 100%)}
.band.top::after{bottom:auto;height:auto;background:radial-gradient(ellipse at 50% 50%,transparent 55%,#000c 100%),linear-gradient(#0000 calc(100% - 3px),#ffffff22 0)}
.band .flash{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 0,#dfe6ff88,transparent 70%);opacity:calc(var(--f,0)*.3);mix-blend-mode:screen}
.band.hit .flash{opacity:1;transition:none}
.band .dust{opacity:.8}
#win::before,#win::after{content:"";position:absolute;width:calc(var(--w)*.07);height:calc(var(--w)*.07);border:calc(var(--w)*.006) solid #fff;filter:drop-shadow(0 0 6px #fff);opacity:.85}
#win::before{left:1.5%;top:2.5%;border-right:0;border-bottom:0}
#win::after{right:1.5%;bottom:2.5%;border-left:0;border-top:0}
#win::before,#win::after{display:none}
body.keep #win::before,body.keep #win::after{display:block}
.glitch{animation:slam .45s cubic-bezier(.2,1.4,.4,1),rgb .5s steps(2) 1!important}
@keyframes rgb{0%,60%{text-shadow:calc(var(--w)*.012) 0 #ff2a55,calc(var(--w)*-.012) 0 #22e6ff}100%{text-shadow:0 calc(var(--w)*.012) 0 #000,0 0 calc(var(--w)*.04) #ffffff40}}
.band.top::before{content:"";position:absolute;right:0;bottom:0;width:32%;height:13%;z-index:1;opacity:.85;transform:skewX(-35deg);transform-origin:100% 100%;
  background:conic-gradient(#050506 25%,#2c2c31 0 50%,#050506 0 75%,#2c2c31 0) 0 0/calc(var(--w)*.05) calc(var(--w)*.05);-webkit-mask-image:linear-gradient(to left,#000 35%,#0000);mask-image:linear-gradient(to left,#000 35%,#0000)}
.band::after{z-index:2}.t,#avatar,.bar{z-index:3}
@media (prefers-reduced-motion:reduce){.smoke,#avatar{animation:none!important}}
</style>
</head>

// Serpihan kecil melengkung (seperti di video)
document.querySelectorAll('canvas.dust').forEach(cv => { const x = cv.getContext('2d'); let W, H, P = []; const fitC = () => { W = cv.width = cv.clientWidth; H = cv.height = cv.clientHeight; }; fitC(); addEventListener('resize', fitC);
  for (let i = 0; i < 70; i++) P.push({x: Math.random(), y: Math.random(), l: 3 + Math.random() * 6, a0: Math.random() * 6.3, v: .01 + Math.random() * .03, ph: Math.random() * 6.3});
  (function d(ms){ x.clearRect(0, 0, W, H); const k = W / 576; x.lineWidth = Math.max(1, k * 1.1); x.lineCap = 'round';
    P.forEach(p => { p.x += p.v * .0125; p.y -= p.v * .008; if (p.x > 1.02 || p.y < -.02){ p.x = Math.random() * .9 - .05; p.y = 1.02; }
      x.strokeStyle = 'rgba(255,255,255,' + (.18 + .5 * Math.max(0, Math.sin(ms / 900 + p.ph))).toFixed(2) + ')'; x.beginPath(); x.arc(p.x * W, p.y * H, p.l * k, p.a0, p.a0 + 1.3); x.stroke(); });
    requestAnimationFrame(d); })(0); });

// ===== Asap: shader WebGL, pita asap sutra mengalir diagonal seperti di video =====
const FS = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 R; uniform float T, S; uniform vec3 B;
float h(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f); return mix(mix(h(i), h(i + vec2(1., 0.)), f.x), mix(h(i + vec2(0., 1.)), h(i + vec2(1., 1.)), f.x), f.y); }
float fbm(vec2 p){ float v = 0., a = .5; mat2 m = mat2(.8, -.6, .6, .8); for (int i = 0; i < 5; i++){ v += a * n(p); p = m * p * 2.03 + 7.1; a *= .5; } return v; }
void main(){
  vec2 uv = gl_FragCoord.xy / R, p = vec2(uv.x * R.x / R.y, uv.y); float t = T * .07;
  vec2 q = mat2(.866, -.5, .5, .866) * p;
  vec2 w = vec2(fbm(q * vec2(1., 2.2) + vec2(t, S)), fbm(q * vec2(1., 2.2) + vec2(5.2 - t, 1.3 + S)));
  float f = fbm(q * vec2(1.1, 3.8) + w * 2.4 + vec2(-t * 1.6, S * .7));
  float rid = pow(1. - abs(2. * f - 1.), 2.8), s = rid * .9 + f * f * .3;
  s *= .22 + .78 * smoothstep(.12, .9, uv.x * .55 + uv.y * .6);
  float lit = B.z * (.4 + 2.4 * exp(-length((uv - B.xy) * vec2(1., .9)) * 2.6));
  float g = .03 + s * .6 * (1. + lit * 1.5) + B.z * .05;
  gl_FragColor = vec4(vec3(g) * vec3(.93, .95, 1.), 1.);
}`;
function Smoke(cv){
  const band = cv.parentElement, gl = cv.getContext('webgl', {antialias: false, alpha: false}); if (!gl) return;
  const mk = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, mk(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(pr, mk(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  const U = k => gl.getUniformLocation(pr, k), seed = band.classList.contains('bot') ? 17 : 3, still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = () => { cv.width = Math.max(2, Math.round(cv.clientWidth * .6)); cv.height = Math.max(2, Math.round(cv.clientHeight * .6)); gl.viewport(0, 0, cv.width, cv.height); };
  fit(); addEventListener('resize', fit);
  (function f(ms){ const b = band._b || [.5, .5, 0];
    gl.uniform2f(U('R'), cv.width, cv.height); gl.uniform1f(U('T'), (ms || 0) / 1000 + seed * 9); gl.uniform1f(U('S'), seed); gl.uniform3f(U('B'), b[0], b[1], b[2]);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); if (!still) requestAnimationFrame(f); })();
}

// ===== Petir: bolt tipis panjang menyilang diagonal, nyala berkali-kali, cabang kecil =====
function Lightning(cv){
  const ctx = cv.getContext('2d'), band = cv.parentElement; let W, H, S = [];
  function fit(){ const d = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d,0,0,d,0,0); }
  function jag(x1, y1, x2, y2, d, o){ if (d < 2){ o.push([x2, y2]); return; } const mx = (x1 + x2) / 2 + (Math.random() - .5) * d, my = (y1 + y2) / 2 + (Math.random() - .5) * d * .6; jag(x1, y1, mx, my, d / 2, o); jag(mx, my, x2, y2, d / 2, o); }
  function strike(){
    const dir = Math.random() < .75 ? 1 : -1, sx = dir > 0 ? W * Math.random() * .35 : W * (.6 + Math.random() * .35), ex = dir > 0 ? W * (.72 + Math.random() * .26) : W * Math.random() * .3, ty = H * (.5 + Math.random() * .32), n = 5 + Math.floor(Math.random() * 3), wp = [[sx, -4]];
    for (let i = 1; i <= n; i++){ const t = i / n; wp.push([sx + (ex - sx) * t + (Math.random() - .5) * W * .06, ty * Math.pow(t, .85) + (i % 2 ? 1 : -1) * H * .09 * Math.random() * (i < n ? 1 : 0)]); }
    const main = [wp[0]]; for (let i = 1; i < wp.length; i++) jag(wp[i-1][0], wp[i-1][1], wp[i][0], wp[i][1], W * .05, main);
    const forks = []; for (let i = 0, nf = 2 + Math.floor(Math.random() * 3); i < nf; i++){ const k = 10 + Math.floor(Math.random() * (main.length - 30)), p = main[k], f = [p]; jag(p[0], p[1], p[0] + (Math.random() - .3) * W * .22 * dir, p[1] + H * (.08 + Math.random() * .2), W * .06, f); forks.push({k, pts: f}); }
    S.push({main, forks, t0: performance.now(), c: [(sx + ex) / 2 / W, 1 - ty * .5 / H]});
    setTimeout(strike, 350 + Math.random() * 800);
  }
  const PK = [[60, 1], [150, .6], [240, .4]];
  function line(pts, n, w, col){ ctx.lineWidth = w; ctx.strokeStyle = col; ctx.beginPath(); for (let i = 0; i < n; i++) i ? ctx.lineTo(pts[i][0], pts[i][1]) : ctx.moveTo(pts[i][0], pts[i][1]); ctx.stroke(); }
  function draw(now){
    ctx.clearRect(0, 0, W, H); ctx.lineJoin = 'round'; ctx.globalCompositeOperation = 'lighter'; let F = 0, c = band._b ? band._b : [.5, .5];
    S = S.filter(s => now - s.t0 < 500);
    S.forEach(s => {
      const t = now - s.t0, n = Math.max(2, Math.floor(s.main.length * Math.min(1, t / 60)));
      let I = t < 60 ? .3 : PK.reduce((m, [tk, a]) => t >= tk ? Math.max(m, a * Math.exp(-(t - tk) / 55)) : m, 0);
      I *= .85 + Math.random() * .15; if (I > F){ F = I; c = s.c; }
      [[W * .016, .13, '150,170,255'], [W * .0065, .4, '200,212,255'], [W * .0032, 1, '255,255,255']].forEach(([w, a, col]) => {
        const cs = 'rgba(' + col + ',' + (a * I).toFixed(3) + ')'; line(s.main, n, w, cs);
        s.forks.forEach(f => { if (n > f.k) line(f.pts, Math.max(2, Math.min(f.pts.length, (n - f.k) * 2)), w * .5, cs); });
      });
    });
    ctx.globalCompositeOperation = 'source-over';
    band._b = [c[0], c[1], F]; band.style.setProperty('--f', F.toFixed(3)); requestAnimationFrame(draw);
  }
  fit(); addEventListener('resize', fit); setTimeout(strike, Math.random() * 600); requestAnimationFrame(draw);
}
// ===== Bulan: berkawah, disinari dari kiri atas, gelap ke kanan bawah (mengikuti video) =====
function Moon(cv){
  const N = 512, C = N / 2, R = 236; cv.width = cv.height = N; const x = cv.getContext('2d'); let sd = 7;
  const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  x.save(); x.beginPath(); x.arc(C, C, R, 0, 6.2832); x.clip();
  let g = x.createRadialGradient(N * .32, N * .26, 10, N * .4, N * .38, R * 1.45);
  g.addColorStop(0, '#8a8a90'); g.addColorStop(.35, '#4a4a50'); g.addColorStop(.7, '#18181b'); g.addColorStop(1, '#050506');
  x.fillStyle = g; x.fillRect(0, 0, N, N);
  x.filter = 'blur(16px)'; for (let i = 0; i < 7; i++){ x.fillStyle = 'rgba(0,0,0,.28)'; x.beginPath(); x.arc(80 + r() * 350, 80 + r() * 350, 30 + r() * 50, 0, 6.3); x.fill(); } x.filter = 'none';
  for (let i = 0; i < 60; i++){
    const cx = 40 + r() * 430, cy = 40 + r() * 430, cr = 5 + r() * r() * 46;
    x.fillStyle = 'rgba(0,0,0,.3)'; x.beginPath(); x.arc(cx, cy, cr, 0, 6.3); x.fill();
    x.lineWidth = Math.max(1.5, cr * .12);
    x.strokeStyle = 'rgba(255,255,255,.22)'; x.beginPath(); x.arc(cx, cy, cr, .2, 1.9); x.stroke();
    x.strokeStyle = 'rgba(0,0,0,.35)'; x.beginPath(); x.arc(cx, cy, cr, 3.4, 5); x.stroke();
  }
  g = x.createRadialGradient(N * .3, N * .25, R * .25, N * .3, N * .25, R * 1.65);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.55, 'rgba(0,0,0,.2)'); g.addColorStop(1, 'rgba(0,0,0,.95)');
  x.fillStyle = g; x.fillRect(0, 0, N, N); x.restore();
  g = x.createLinearGradient(N * .15, N * .15, N * .7, N * .75);
  g.addColorStop(0, 'rgba(245,245,250,1)'); g.addColorStop(.5, 'rgba(200,200,210,.35)'); g.addColorStop(.8, 'rgba(200,200,210,0)');
  x.strokeStyle = g; x.lineWidth = 7; x.shadowColor = 'rgba(255,255,255,.7)'; x.shadowBlur = 12; x.beginPath(); x.arc(C, C, R - 3, 0, 6.2832); x.stroke();
}
document.querySelectorAll('canvas.moon').forEach(Moon);
document.querySelectorAll('canvas.smk').forEach(Smoke);
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelectorAll('canvas.bolt').forEach(Lightning);
